<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="sky" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#2a4a8f"/><stop offset=".45" stop-color="#0f2154"/><stop offset="1" stop-color="#050a1c"/>
    </radialGradient>
    <radialGradient id="fireL" cx="18%" cy="78%" r="55%"><stop offset="0" stop-color="#ff5a1f" stop-opacity=".95"/><stop offset=".5" stop-color="#c3121e" stop-opacity=".55"/><stop offset="1" stop-color="#c3121e" stop-opacity="0"/></radialGradient>
    <radialGradient id="iceR" cx="84%" cy="74%" r="55%"><stop offset="0" stop-color="#4fb3ff" stop-opacity=".9"/><stop offset=".5" stop-color="#1f4fd6" stop-opacity=".5"/><stop offset="1" stop-color="#1f4fd6" stop-opacity="0"/></radialGradient>
    <radialGradient id="lamp"><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="#fff6d8" stop-opacity=".9"/><stop offset="1" stop-color="#fff6d8" stop-opacity="0"/></radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="crestTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d3d8f"/><stop offset="1" stop-color="#0c1f5c"/></linearGradient>
    <linearGradient id="crestBot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2243a"/><stop offset="1" stop-color="#8f0d1d"/></linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#cfd6e2"/><stop offset="1" stop-color="#8d97a8"/></linearGradient>
    <linearGradient id="ball" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b8632f"/><stop offset=".55" stop-color="#7c3713"/><stop offset="1" stop-color="#4a1f08"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1b3"/><stop offset=".45" stop-color="#e3b23c"/><stop offset="1" stop-color="#8a5a10"/></linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c3121e"/><stop offset=".5" stop-color="#5a1a5e"/><stop offset="1" stop-color="#1f4fd6"/></linearGradient>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#sky)"/>
  <rect width="512" height="512" rx="104" fill="url(#fireL)"/>
  <rect width="512" height="512" rx="104" fill="url(#iceR)"/>
  <!-- faisceaux des projecteurs -->
  <path d="M70 40 L190 300 L120 300 Z" fill="url(#beam)" opacity=".5"/>
  <path d="M442 40 L322 300 L392 300 Z" fill="url(#beam)" opacity=".5"/>
  <circle cx="70" cy="44" r="46" fill="url(#lamp)"/><circle cx="442" cy="44" r="46" fill="url(#lamp)"/>
  <!-- tribune -->
  <path d="M0 430 Q256 380 512 430 L512 512 L0 512 Z" fill="#050913" opacity=".85"/>
  <g fill="#ffd98a" opacity=".55">
    <circle cx="60" cy="432" r="3"/><circle cx="110" cy="420" r="3"/><circle cx="170" cy="410" r="3"/><circle cx="342" cy="410" r="3"/><circle cx="402" cy="420" r="3"/><circle cx="452" cy="432" r="3"/>
  </g>
  <!-- emblème rond original : anneau doré, ballon en diagonale avec traînées rouge et bleue, ruban -->
  <g filter="url(#glow)">
    <circle cx="256" cy="226" r="150" fill="#0a1433" stroke="url(#gold)" stroke-width="14"/>
    <circle cx="256" cy="226" r="128" fill="none" stroke="#ffffff" stroke-opacity=".25" stroke-width="2"/>
  </g>
  <path d="M120 300 C190 270 220 250 250 222 L262 236 C230 268 190 300 120 318 Z" fill="#ff3b2f" opacity=".9"/>
  <path d="M392 152 C322 182 292 202 262 230 L250 216 C282 184 322 152 392 134 Z" fill="#2f8bff" opacity=".9"/>
  <g transform="translate(256 226) rotate(-35)">
    <ellipse rx="86" ry="48" fill="url(#ball)" stroke="#2a1205" stroke-width="4"/>
    <path d="M-70 -20 Q0 -42 70 -20" stroke="#fff" stroke-width="6" fill="none"/>
    <path d="M-70 20 Q0 42 70 20" stroke="#fff" stroke-width="6" fill="none"/>
    <path d="M-30 0 L30 0" stroke="#fff" stroke-width="6"/>
    <path d="M-18 -10 L-18 10 M-6 -10 L-6 10 M6 -10 L6 10 M18 -10 L18 10" stroke="#fff" stroke-width="4.5"/>
  </g>
  <!-- ruban -->
  <path d="M70 372 L104 352 L104 412 L70 432 L88 402 Z" fill="#8a0d1b"/>
  <path d="M442 372 L408 352 L408 412 L442 432 L424 402 Z" fill="#0d2f8a"/>
  <path d="M96 344 L416 344 L416 410 L96 410 Z" fill="url(#ribbon)" stroke="url(#gold)" stroke-width="4"/>
  <text x="256" y="396" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-weight="900" font-size="44" fill="#ffffff" stroke="#0a0f1f" stroke-width="3" paint-order="stroke" letter-spacing="2">NFL LEAGUE</text>
</svg>
